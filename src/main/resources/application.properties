spring.application.name=payment-service

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Kafka producer
spring.kafka.bootstrap-servers=${KAFKA_BROKERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.properties.enable.idempotence=true

# Server
server.port=${SERVER_PORT}

# Actuator
management.server.port=${MANAGEMENT_PORT}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Payment gateway configs
payment.gateway.nagad.base-url=${NAGAD_BASE_URL}
payment.gateway.nagad.merchant-id=${NAGAD_MERCHANT_ID}
payment.gateway.nagad.secret-key=${NAGAD_SECRET_KEY}

payment.gateway.bkash.base-url=${BKASH_BASE_URL}
payment.gateway.bkash.app-key=${BKASH_APP_KEY}
payment.gateway.bkash.app-secret=${BKASH_APP_SECRET}

payment.gateway.stripe.secret-key=${STRIPE_SECRET_KEY}
payment.gateway.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

payment.gateway.card.base-url=${CARD_BASE_URL}
payment.gateway.card.merchant-id=${CARD_MERCHANT_ID}
payment.gateway.card.secret-key=${CARD_SECRET_KEY}

# Webhook base URL — returned to gateway for callback
payment.webhook.base-url=${WEBHOOK_BASE_URL}